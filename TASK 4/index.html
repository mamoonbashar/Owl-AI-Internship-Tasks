<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overload ware Labs (Owl AI)</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-25..0"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="backgroundIllustrationsContainer">
      <img src="/TASK 4/assets/Illustration1.png" alt="logo" />
      <img src="/TASK 4/assets/illustration2.png" alt="logo" />
    </section>

    <section class="MasterContainer glass-card">
      <section class="HeadingContainer">
        <h1>OWL AI PROJECT</h1>
      </section>
      <section class="MainContent">
        <section class="AppHeadingBox">
          <h1>AI Image Recognition</h1>
        </section>
        <section class="UplaodImageContainer">
          <img src="" id="ShowImage" alt="Image" />
          <label for="ImageInput"
            >Click here to Upload or Drag and Drop image</label
          >
          <input
            type="file"
            id="ImageInput"
            accept="image/jpeg,image/png,image/jpg"
          />
        </section>
        <section class="UplaodImageBtnContainer">
          <button class="UplaodImageBtn">Upload Image</button>
        </section>
        <section class="fileDescCotainer">
          <button class="removeImageBtn">Remove Image</button>
        </section>
        <section class="ImageResultContainer">
          <section class="ImageInfoContainers">
            <section class="ImageHeadingAndResultContainer">
              <p class="objectName">Object name in image</p>
            </section>
            <section class="ImageHeadingAndResultContainer">
              <p class="objectConfidence">Accuracy percentage</p>
            </section>
          </section>

          <section class="ImageInfoContainers">
            <section class="finalResult"><p></p></section>
          </section>
        </section>
      </section>
    </section>
    <script type="module" src="script.js"></script>
  </body>
</html>
